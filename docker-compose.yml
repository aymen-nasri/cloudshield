# Local core stack. Secrets come from .env (copy .env.example), never from this file.
services:
  core:
    build: .
    ports: ["8080:8080"]
    environment:
      # Matches the recorded fixtures so `make demo-incident` correlates them into one case.
      CLOUDSHIELD_CLUSTER: cs-lab-eks
      CLOUDSHIELD_ACCOUNT_ID: "123456789012"
      CLOUDSHIELD_EVIDENCE_DIR: /evidence
      # Deterministic baseline, no LLM. Set to "bedrock" + CLOUDSHIELD_BEDROCK_MODEL_ID for Bedrock.
      CLOUDSHIELD_INVESTIGATOR: offline
      CLOUDSHIELD_FALCO_TOKEN: ${CLOUDSHIELD_FALCO_TOKEN:?set in .env}
      CLOUDSHIELD_WAZUH_HMAC_SECRET: ${CLOUDSHIELD_WAZUH_HMAC_SECRET:?set in .env}
      CLOUDSHIELD_REPLAY_HMAC_SECRET: ${CLOUDSHIELD_REPLAY_HMAC_SECRET:?set in .env}
      # The core API applies services/cases/migrations on startup.
      CLOUDSHIELD_DATABASE_URL: postgresql://cloudshield:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/cloudshield
    volumes:
      - ./.local-evidence:/evidence
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudshield
      POSTGRES_USER: cloudshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "cloudshield"]
      interval: 5s
      retries: 10

  # Started for the search work that follows (M2): not used by the core API yet.
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"   # local only
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]

volumes:
  pgdata:
