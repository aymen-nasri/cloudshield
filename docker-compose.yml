# Local core stack. Secrets come from .env (copy .env.example), never from this file.
services:
  core:
    build: .
    ports: ["8080:8080"]
    environment:
      # Matches the recorded fixtures so `make demo-incident` correlates them into one case.
      CLOUDSHIELD_CLUSTER: cs-lab-eks
      CLOUDSHIELD_ACCOUNT_ID: "123456789012"
      CLOUDSHIELD_EVIDENCE_DIR: /evidence
      CLOUDSHIELD_FALCO_TOKEN: ${CLOUDSHIELD_FALCO_TOKEN:?set in .env}
      CLOUDSHIELD_WAZUH_HMAC_SECRET: ${CLOUDSHIELD_WAZUH_HMAC_SECRET:?set in .env}
      CLOUDSHIELD_REPLAY_HMAC_SECRET: ${CLOUDSHIELD_REPLAY_HMAC_SECRET:?set in .env}
    volumes:
      - ./.local-evidence:/evidence
    depends_on: [postgres, opensearch]

  # PostgreSQL and OpenSearch are started now so the M2 stores can be developed against them.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudshield
      POSTGRES_USER: cloudshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - ./services/cases/migrations:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"   # local only
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
