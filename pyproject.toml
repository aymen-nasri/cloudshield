[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudshield"
version = "0.1.0"
description = "AI-assisted cloud-native security operations with human-controlled incident response"
readme = "README.md"
license = "MIT"
authors = [{ name = "Aymen Nasri" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
aws = ["boto3>=1.35"]
k8s = ["kubernetes>=31.0"]
postgres = ["psycopg[binary,pool]>=3.2"]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["services"]

[tool.setuptools.package-data]
investigator = ["prompts/*.md"]
policy = ["policies/*.yaml"]
cases = ["migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["services", "."]
testpaths = ["tests"]
markers = ["postgres: needs CLOUDSHIELD_TEST_DATABASE_URL (a disposable PostgreSQL database)"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["services", "tests", "evals", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"evals/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
mypy_path = "services"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
