name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cloudshield_test
          POSTGRES_USER: cloudshield
          POSTGRES_HOST_AUTH_METHOD: trust # throwaway CI database, reachable only from this job
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cloudshield"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CLOUDSHIELD_TEST_DATABASE_URL: postgresql://cloudshield@localhost:5432/cloudshield_test
      CLOUDSHIELD_REQUIRE_POSTGRES_TESTS: "1" # fail, don't skip, if the database is missing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy services
      - run: pytest -q
      - name: Schemas match the Pydantic models
        run: python scripts/export_schemas.py --check
      - name: AI evaluation harness (stored candidates)
        run: python evals/run_evals.py

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Infrastructure is checked without any cloud account: syntax, schemas, policy behavior.
  infra:
    name: validate infrastructure
    runs-on: ubuntu-latest
    env:
      TOFU_VERSION: "1.13.1"
      HELM_VERSION: "v3.22.0"
      KUBECONFORM_VERSION: "v0.8.0"
      KYVERNO_VERSION: "v1.19.1"
      KUBERNETES_VERSION: "1.31.0" # matches cluster_version in infra/tofu/envs/lab/eks.tf
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: OpenTofu format
        run: tofu fmt -check -recursive -diff infra/tofu
      - name: OpenTofu validate (no backend, no AWS credentials)
        working-directory: infra/tofu/envs/lab
        run: |
          tofu init -backend=false -input=false
          tofu validate

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Helm lint and render
        run: |
          helm lint --strict infra/helm/cloudshield
          helm template cloudshield infra/helm/cloudshield --namespace cloudshield > rendered-chart.yaml

      - name: Install kubeconform and the Kyverno CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" kubeconform
          curl -sSfL "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" kyverno
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Kubernetes manifests match their schemas (core + Kyverno CRDs)
        run: |
          kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            infra/k8s infra/policies/networkpolicies infra/policies/rbac infra/policies/kyverno/*.yaml rendered-chart.yaml
      - name: Kyverno policy tests (the quarantine guard catches a leaky allow-policy)
        run: kyverno test infra/policies/kyverno/tests

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ansible syntax check
        working-directory: infra/ansible
        run: |
          pip install "ansible-core>=2.17,<2.19"
          ansible-playbook --syntax-check -i inventory.example.ini harden-host.yml wazuh-agent.yml

  compose:
    name: docker compose setup, login and persistence
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: The README's local setup, from .env.example to a restart
        run: bash scripts/compose_check.sh
      - name: Logs (on failure)
        if: failure()
        run: docker compose logs core --tail=80

  # AWS paths against an emulator, with no account or cost. Not proof of real AWS behavior.
  emulated-aws:
    name: emulated AWS, from OpenTofu to a case
    runs-on: ubuntu-latest
    needs: test
    env:
      TOFU_VERSION: "1.13.1" # matches the infra job
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,emulation]"
      - name: Apply the lab's OpenTofu files to Moto, and run the AWS paths on them
        run: bash scripts/emulated_aws.sh
      - name: Emulator log (on failure)
        if: failure()
        run: tail -60 moto.log || true

  local-model:
    name: a real local model, through the investigation checks
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    env:
      OLLAMA_VERSION: "0.40.14"
      OLLAMA_MODEL: llama3.2:1b # small enough for a CI runner's CPU; it isn't there for its judgment
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Start Ollama and fetch the model
        run: |
          docker run -d --name ollama -p 11434:11434 "ollama/ollama:$OLLAMA_VERSION"
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:11434/api/version && break
            sleep 1
          done
          docker exec ollama ollama pull "$OLLAMA_MODEL"
      - name: Investigate S1 and S8 with it
        run: python scripts/local_model_check.py --model "$OLLAMA_MODEL"
      - name: Ollama log (on failure)
        if: failure()
        run: docker logs --tail 60 ollama || true

  lab:
    name: kind lab, scenario S1 end to end
    runs-on: ubuntu-latest
    needs: test
    env:
      CALICO_VERSION: v3.29.1 # matches the Makefile
      FALCO_CHART_VERSION: 9.2.2
      KYVERNO_VERSION: v1.19.2
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true
      - name: Create the lab cluster (Calico, because kindnet does not enforce NetworkPolicy)
        run: |
          # Falco, Kyverno and kind all use inotify; the runner's default of 128 instances runs out.
          sudo sysctl -w fs.inotify.max_user_instances=1024 fs.inotify.max_user_watches=524288
          kind create cluster --config infra/kind/cluster.yaml
          kubectl apply -f "https://raw.githubusercontent.com/projectcalico/calico/${CALICO_VERSION}/manifests/calico.yaml"
          kubectl -n kube-system rollout status ds/calico-node --timeout=300s
          kubectl wait --for=condition=Ready nodes --all --timeout=180s
      - name: Deploy the shop app, quarantine-ready NetworkPolicies, RBAC and the traffic probe
        run: |
          kubectl create namespace cloudshield
          kubectl apply -f infra/k8s/demo-shop/shop.yaml
          kubectl apply -f infra/policies/networkpolicies/shop.yaml
          kubectl apply -f infra/policies/rbac/cloudshield-rbac.yaml
          kubectl apply -f infra/kind/probe.yaml
          kubectl -n shop rollout status deploy/checkout --timeout=180s
          kubectl -n shop wait --for=condition=Ready pod/probe --timeout=120s
      - name: Install Kyverno and enforce the quarantine guard
        run: |
          kubectl create -f "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/install.yaml"
          kubectl -n kyverno rollout status deploy/kyverno-admission-controller --timeout=300s
          # The deployment can report ready a few seconds before its webhook accepts connections.
          for attempt in 1 2 3 4 5 6; do
            kubectl apply -f infra/policies/kyverno/require-quarantine-exclusion.yaml && break
            sleep 10
          done
          kubectl wait --for=condition=Ready clusterpolicy/require-quarantine-exclusion --timeout=120s
      - name: Build this commit and deploy it with the Helm chart
        run: bash infra/kind/deploy-cloudshield.sh
      - name: Install Prometheus and Grafana
        run: bash infra/kind/deploy-monitoring.sh
      # This commit's image is unsigned (only main's CI signs), so enforcement starts after the deploy.
      # The job below runs the signed image under enforcement from the start.
      - name: Enforce image verification
        run: |
          kubectl apply -f infra/policies/kyverno/verify-cloudshield-images.yaml
          kubectl wait --for=condition=Ready clusterpolicy/verify-cloudshield-images --timeout=120s
      - name: Install Falco (modern eBPF) with Falcosidekick posting to the CloudShield Service
        run: |
          helm repo add falcosecurity https://falcosecurity.github.io/charts
          # Pod and namespace names come from the container runtime, so the k8s metadata collector is off.
          helm install falco falcosecurity/falco --version "${FALCO_CHART_VERSION}" -n falco --create-namespace \
            -f infra/helm/falco-values.yaml \
            --set collectors.kubernetes.enabled=false \
            --set-file 'customRules.cloudshield_rules\.yaml=detections/falco/cloudshield_rules.yaml' \
            --set falcosidekick.config.webhook.customHeaders="Authorization:Bearer lab-falco-key" \
            --wait --timeout 8m
          kubectl -n falco get pods -o wide
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,k8s]"
      - name: Scenario S1 from a live Falco detection, against CloudShield in the cluster
        run: python scripts/lab_e2e.py --alert falco --admission --svg lab-run.svg
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lab-run
          path: lab-run.svg
          if-no-files-found: ignore
      - name: Cluster state (on failure)
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n shop get networkpolicies,pods --show-labels
          kubectl get clusterpolicies || true
          kubectl -n cloudshield describe pods -l app.kubernetes.io/name=cloudshield-core | tail -30 || true
          kubectl -n cloudshield logs deploy/cloudshield-core --tail=80 || true
          kubectl -n falco logs -l app.kubernetes.io/name=falco -c falco --tail=60 || true
          kubectl -n falco logs -l app.kubernetes.io/name=falcosidekick --tail=60 || true

  image:
    name: build and scan image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t cloudshield/core:${{ github.sha }} .
      - name: Trivy image scan (fail on fixable critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cloudshield/core:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy config scan (report only; audit before enforce)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: "0"
      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cloudshield/core:${{ github.sha }}
          format: cyclonedx
          output: sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json

  # On main: publish to GitHub's container registry, sign keylessly, attach the SBOM as a signed
  # attestation, then verify both the way a consumer (or Kyverno) would. Needs no AWS account.
  ghcr:
    name: publish, sign and verify on GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [image, secrets, lab]
    permissions:
      contents: read
      packages: write # push to ghcr.io with the workflow's own token
      id-token: write # keyless Cosign signing with the workflow's OIDC identity
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        id: push
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:main" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:main"
          echo "digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}")" >> "$GITHUB_OUTPUT"
      - name: SBOM of the pushed image (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: cyclonedx
          output: sbom.cdx.json
      - uses: sigstore/cosign-installer@v3
      - name: Keyless sign, and attach the SBOM as a signed attestation
        run: |
          cosign sign --yes "${{ steps.push.outputs.digest }}"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${{ steps.push.outputs.digest }}"
      - name: Verify the signature and the attestation against this workflow's identity
        run: |
          cosign verify "${{ steps.push.outputs.digest }}" \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" > /dev/null
          cosign verify-attestation "${{ steps.push.outputs.digest }}" --type cyclonedx \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" > /dev/null
          {
            echo "### Signed image"
            echo
            echo "\`${{ steps.push.outputs.digest }}\`"
            echo
            echo "Signature and CycloneDX SBOM attestation verified for \`$IDENTITY\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # On main: the image just signed really starts, with image verification enforced from the beginning,
  # and an unsigned image really is refused. Pull requests can't test this: only main's CI signs.
  signed-deploy:
    name: signed image runs under admission control
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: ghcr
    env:
      KYVERNO_VERSION: v1.19.2 # matches the lab job
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true
      - name: Create a cluster and enforce image verification
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=1024 fs.inotify.max_user_watches=524288
          kind create cluster --name signed-deploy --wait 120s
          kubectl create -f "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/install.yaml"
          kubectl -n kyverno rollout status deploy/kyverno-admission-controller --timeout=300s
          for attempt in 1 2 3 4 5 6; do
            kubectl apply -f infra/policies/kyverno/verify-cloudshield-images.yaml && break
            sleep 10
          done
          kubectl wait --for=condition=Ready clusterpolicy/verify-cloudshield-images --timeout=120s
      - name: Deploy the signed image with the Helm chart
        run: |
          kubectl create namespace cloudshield
          kubectl -n cloudshield create serviceaccount cloudshield-investigator
          kubectl -n cloudshield create secret generic cloudshield-ingest-credentials \
            --from-literal=CLOUDSHIELD_FALCO_TOKEN=signed-deploy-check
          helm install cloudshield infra/helm/cloudshield -n cloudshield \
            --set image.tag=${{ github.sha }} --wait --timeout 5m
          kubectl -n cloudshield get pods -o jsonpath='{.items[*].spec.containers[*].image}{"\n"}' | tee images.txt
          grep -q '^ghcr.io/aymen-nasri/cloudshield:.*@sha256:\|^ghcr.io/aymen-nasri/cloudshield@sha256:' images.txt
      - name: An unsigned image is refused for real
        run: |
          if kubectl -n cloudshield run unsigned --image=busybox:1.37.0 --restart=Never 2> refused.txt; then
            echo "an unsigned image was admitted"; exit 1
          fi
          cat refused.txt
          grep -q 'no signatures found' refused.txt
      - name: Cluster state (on failure)
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n cloudshield describe pods | tail -30 || true

  # Runs only on main and only once the AWS lab exists (AWS_ROLE_ARN repository variable set).
  publish:
    name: sign and push to ECR
    if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    needs: [image, secrets]
    permissions:
      contents: read
      id-token: write # GitHub OIDC: short-lived AWS credentials and keyless Cosign signing
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        id: push
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/cloudshield/core:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v3
      - name: Keyless sign (verified at admission by Kyverno)
        run: cosign sign --yes "${{ steps.push.outputs.digest }}"
