# Weekly update pull requests. Each one goes through the same CI as any other change, including
# the kind lab, so an update that breaks detection or the quarantine is caught before merge.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
