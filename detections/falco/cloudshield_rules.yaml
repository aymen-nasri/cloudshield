# CloudShield custom Falco rules for the protected "shop" namespace.
# Loaded through infra/helm/falco-values.yaml (customRules). Tags carry MITRE ATT&CK IDs that the
# ingestion adapter maps into OCSF `attacks`.

- list: shop_expected_processes
  items: [node, npm, tini]

- macro: protected_workload
  condition: (container and k8s.ns.name = "shop")

- rule: Unexpected Process in Protected Workload
  desc: A process outside the expected allowlist started in a CloudShield-protected app container.
  condition: >
    spawned_process and protected_workload
    and not proc.name in (shop_expected_processes)
  output: >
    Unexpected process in protected workload (proc=%proc.name cmdline=%proc.cmdline
    user=%user.name pod=%k8s.pod.name ns=%k8s.ns.name image=%container.image.repository)
  priority: WARNING
  tags: [cloudshield, mitre_execution, T1059]

- rule: Remote Script Piped to Shell in Container
  desc: A shell is fed the output of curl or wget, the classic download-and-run pattern.
  condition: >
    spawned_process and protected_workload
    and proc.name in (sh, bash, ash, dash)
    and (proc.cmdline contains "curl" or proc.cmdline contains "wget")
    and proc.cmdline contains "|"
  output: >
    Remote script piped to shell (cmdline=%proc.cmdline user=%user.name pod=%k8s.pod.name
    ns=%k8s.ns.name image=%container.image.repository)
  priority: CRITICAL
  tags: [cloudshield, mitre_execution, T1059.004, T1105]

- rule: Kubectl Exec Shell in Protected Workload
  desc: An interactive shell was attached to a protected container (kubectl exec / attach).
  condition: >
    spawned_process and protected_workload
    and proc.name in (sh, bash, ash, dash)
    and proc.tty != 0
  output: >
    Interactive shell in protected workload (user=%user.name pod=%k8s.pod.name
    ns=%k8s.ns.name cmdline=%proc.cmdline)
  priority: NOTICE
  tags: [cloudshield, mitre_execution, T1609]
