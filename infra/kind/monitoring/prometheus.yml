global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/alerts.yml

scrape_configs:
  - job_name: cloudshield
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secret/token # /metrics needs a login, like every other route
    static_configs:
      - targets: ["cloudshield-core.cloudshield.svc:80"]
