image:
  repository: ghcr.io/aymen-nasri/cloudshield # signed by CI; Kyverno admits nothing else here
  tag: main
  pullPolicy: IfNotPresent

replicaCount: 1

cluster: cs-lab-eks
accountId: ""

# Existing Secret holding CLOUDSHIELD_FALCO_TOKEN, CLOUDSHIELD_WAZUH_HMAC_SECRET and
# CLOUDSHIELD_DATABASE_URL. Created from AWS Secrets Manager by the External Secrets Operator.
credentialsSecret: cloudshield-ingest-credentials

# "k8s" resolves pod -> deployment -> service account -> IAM role -> instance for each event,
# using the read-only cloudshield-investigator identity. Empty disables enrichment.
enrichment: k8s

serviceAccountName: cloudshield-investigator

# Runs the responder as its own pod and has the API call it. Disabled: the API can't act at all.
responder:
  enabled: false
  apiTokenSecret: "" # a Secret with a `token` key, shared by the API and the responder

# The responder's check that a quarantine blocks real traffic. Set all three, or leave them empty to skip it.
trafficProbe:
  pod: "" # namespace/pod of a peer the NetworkPolicies allow
  tokenSecret: "" # the cloudshield-prober token
  targetSelector: "" # key=value,... of the pods that peer may reach

service:
  port: 80

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }
