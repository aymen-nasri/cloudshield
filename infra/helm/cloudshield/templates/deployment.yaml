apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudshield-core
  labels: { app.kubernetes.io/name: cloudshield-core }
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app.kubernetes.io/name: cloudshield-core }
  template:
    metadata:
      labels: { app.kubernetes.io/name: cloudshield-core }
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001 # lets the non-root process read the mounted tokens
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: core
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: CLOUDSHIELD_CLUSTER, value: {{ .Values.cluster | quote }} }
            - { name: CLOUDSHIELD_ACCOUNT_ID, value: {{ .Values.accountId | quote }} }
            - { name: CLOUDSHIELD_ENRICHMENT, value: {{ .Values.enrichment | quote }} }
            {{- if .Values.executor }}
            - { name: CLOUDSHIELD_EXECUTOR, value: {{ .Values.executor | quote }} }
            - { name: CLOUDSHIELD_RESPONDER_TOKEN_FILE, value: /var/run/secrets/cloudshield/responder/token }
            {{- end }}
            {{- if .Values.trafficProbe.pod }}
            - { name: CLOUDSHIELD_PROBE_POD, value: {{ .Values.trafficProbe.pod | quote }} }
            - { name: CLOUDSHIELD_PROBE_TOKEN_FILE, value: /var/run/secrets/cloudshield/prober/token }
            - { name: CLOUDSHIELD_PROBE_TARGET_SELECTOR, value: {{ .Values.trafficProbe.targetSelector | quote }} }
            {{- end }}
          envFrom:
            - secretRef: { name: {{ .Values.credentialsSecret }} }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if .Values.executor }}
            - { name: responder-token, mountPath: /var/run/secrets/cloudshield/responder, readOnly: true }
            {{- end }}
            {{- if .Values.trafficProbe.pod }}
            - { name: prober-token, mountPath: /var/run/secrets/cloudshield/prober, readOnly: true }
            {{- end }}
      volumes:
        - { name: tmp, emptyDir: {} }
        {{- if .Values.executor }}
        - name: responder-token
          secret: { secretName: {{ .Values.responderTokenSecret }}, defaultMode: 0440 }
        {{- end }}
        {{- if .Values.trafficProbe.pod }}
        - name: prober-token
          secret: { secretName: {{ .Values.trafficProbe.tokenSecret }}, defaultMode: 0440 }
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: cloudshield-core
spec:
  selector: { app.kubernetes.io/name: cloudshield-core }
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
