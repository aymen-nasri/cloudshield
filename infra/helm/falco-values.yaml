# Values for the falcosecurity/falco chart.
#   helm upgrade --install falco falcosecurity/falco -n falco --create-namespace \
#     -f infra/helm/falco-values.yaml --set-file customRules.cloudshield_rules\.yaml=detections/falco/cloudshield_rules.yaml \
#     --set falcosidekick.config.webhook.customHeaders="Authorization:Bearer $CLOUDSHIELD_FALCO_TOKEN"
driver:
  kind: modern_ebpf

collectors:
  kubernetes:
    enabled: true

falco:
  json_output: true
  json_include_output_property: true
  json_include_tags_property: true

falcosidekick:
  enabled: true
  config:
    webhook:
      address: http://cloudshield-core.cloudshield.svc.cluster.local/v1/ingest/falco
      minimumpriority: notice
      # customHeaders is set at install time so the token never lands in git.
