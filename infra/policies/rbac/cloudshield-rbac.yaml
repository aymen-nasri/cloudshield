# Two identities with no overlap:
#   cloudshield-investigator: read-only, cluster-wide metadata for enrichment.
#   cloudshield-responder:    may patch pod labels in protected namespaces, nothing else.
#   cloudshield-prober:       may exec into the one probe pod, to test traffic after a quarantine.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudshield-investigator
  namespace: cloudshield
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudshield-investigator
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes, serviceaccounts, services]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch]
  # Deliberately absent: secrets, pods/exec, pods/log, any write verb.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudshield-investigator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloudshield-investigator
subjects:
  - kind: ServiceAccount
    name: cloudshield-investigator
    namespace: cloudshield
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudshield-responder
  namespace: cloudshield
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudshield-responder
  namespace: shop
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, patch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudshield-responder
  namespace: shop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudshield-responder
subjects:
  - kind: ServiceAccount
    name: cloudshield-responder
    namespace: cloudshield
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudshield-prober
  namespace: cloudshield
---
# The verifier's traffic probe runs curl in the probe pod (infra/kind/probe.yaml). resourceNames
# limits exec to that one pod: the prober cannot run commands in any workload, including the
# quarantined one.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudshield-prober
  namespace: shop
rules:
  - apiGroups: [""]
    resources: [pods/exec]
    resourceNames: [probe]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudshield-prober
  namespace: shop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudshield-prober
subjects:
  - kind: ServiceAccount
    name: cloudshield-prober
    namespace: cloudshield
---
# The prober's token, mounted only in the responder pod. The responder pod runs as
# cloudshield-responder itself, and the API pod as the read-only investigator.
apiVersion: v1
kind: Secret
metadata:
  name: cloudshield-prober-token
  namespace: cloudshield
  annotations:
    kubernetes.io/service-account.name: cloudshield-prober
type: kubernetes.io/service-account-token
