# Every allow-policy in a protected namespace must exclude quarantined pods, otherwise the
# quarantine label would silently stop working. Enforced: the kind lab job proves that the
# API server rejects a leaky allow-policy (scripts/lab_e2e.py --admission).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-quarantine-exclusion
  annotations:
    policies.kyverno.io/title: Require quarantine exclusion
    policies.kyverno.io/category: CloudShield
    policies.kyverno.io/description: >-
      NetworkPolicies in namespaces labelled cloudshield.io/protected=true must not select
      pods labelled cloudshield.io/quarantine=true.
spec:
  background: true
  rules:
    - name: allow-policies-exclude-quarantined-pods
      match:
        any:
          - resources:
              kinds: [NetworkPolicy]
              namespaceSelector:
                matchLabels:
                  cloudshield.io/protected: "true"
      # Only a policy that allows something can leak. A real default-deny has no rules, so it's left out
      # by what it does and not by its name, which anyone can copy.
      preconditions:
        any:
          - key: "{{ request.object.spec.ingress || `[]` | length(@) }}"
            operator: GreaterThan
            value: 0
          - key: "{{ request.object.spec.egress || `[]` | length(@) }}"
            operator: GreaterThan
            value: 0
      validate:
        failureAction: Enforce
        message: >-
          Add matchExpressions {key: cloudshield.io/quarantine, operator: NotIn, values: ["true"]}
          to spec.podSelector so quarantined pods fall back to default-deny.
        deny:
          conditions:
            all:
              - key: "{{ request.object.spec.podSelector.matchExpressions || `[]` | [?key=='cloudshield.io/quarantine' && operator=='NotIn' && contains(values, 'true')] | length(@) }}"
                operator: Equals
                value: 0
