# Only images signed by this repository's GitHub Actions workflow on main may run in the cloudshield
# namespace (keyless Cosign signatures, verified against Sigstore's transparency log). It matches every
# image: a list of CloudShield's own names would let an image under any other name through unchecked.
# The kind lab job proves it (scripts/lab_e2e.py --admission).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-cloudshield-images
spec:
  webhookTimeoutSeconds: 30
  rules:
    - name: require-keyless-signature
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [cloudshield]
      verifyImages:
        - failureAction: Enforce
          imageReferences:
            - "*"
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/aymen-nasri/cloudshield/.github/workflows/ci.yml@refs/heads/main"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
