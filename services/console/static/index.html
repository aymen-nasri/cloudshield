<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CloudShield console</title>
  <link rel="stylesheet" href="/console/style.css">
  <script src="/console/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true"></span>CloudShield</div>
    <div id="coverage" class="coverage" aria-label="Sensor coverage"></div>
    <div id="who" class="who"></div>
  </header>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <main id="root" class="layout">
    <p class="muted">Loading…</p>
  </main>
</body>
</html>
